name: ci

on:
  push:
    branches: [main, native-direct-engine]
  pull_request:

permissions:
  contents: read

env:
  # Pin the GenVM runner used by native Direct Mode CI so the evidence is reproducible.
  GENVM_VERSION: v0.3.0-rc7

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,genlayer]'
      - run: python -m compileall -q cogent
      - run: ruff check cogent tests
      - run: pytest --cov=cogent --cov-report=term-missing
      - name: Native Direct Mode executes captured GenLayer validator function
        run: |
          pytest -q tests/test_direct_engine.py::test_native_direct_engine_executes_real_validator_fn
      - name: Official genlayer-test validator profile round-trip
        run: |
          cogent validate \
            --fleet examples/fleet-smoke.yaml \
            --corpus examples/corpus-smoke.yaml \
            --gltest
      - name: Synthetic external-runner end-to-end smoke
        run: |
          cogent run \
            --engine external \
            --fleet examples/fleet-smoke.yaml \
            --corpus examples/corpus-smoke.yaml \
            --runner 'python examples/runner_synthetic.py' \
            --repetitions 1 \
            --workers 3 \
            --output /tmp/cogent-observations.jsonl
          cogent analyze \
            --fleet examples/fleet-smoke.yaml \
            --corpus examples/corpus-smoke.yaml \
            --observations /tmp/cogent-observations.jsonl \
            --committee-size 3 \
            --simulations 1000 \
            --output-dir /tmp/cogent-report
