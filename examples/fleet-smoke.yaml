version: 1
validators:
  - id: alpha-smoke
    stake: 3
    provider: openai
    model: gpt-4o
    plugin: openai-compatible
    config: {temperature: 0.2}
    plugin_config: {api_key_env_var: OPENAI_API_KEY}
    labels: {synthetic_behavior: alpha}
  - id: delta-smoke
    stake: 2
    provider: ollama
    model: llama3
    plugin: ollama
    config: {temperature: 0.5}
    plugin_config: {api_url: http://localhost:11434}
    labels: {synthetic_behavior: delta}
  - id: gamma-smoke
    stake: 1
    provider: openai
    model: gpt-4o-mini
    plugin: openai-compatible
    config: {temperature: 0.1}
    plugin_config: {api_key_env_var: OPENAI_API_KEY}
    labels: {synthetic_behavior: gamma}
